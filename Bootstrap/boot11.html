<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>table2</title>
	<link rel='stylesheet' type='text/css' href="bootstrap-3.3.7-dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container">
		<table class='table table-hover table-bordered'>
        <thead>
            <tr class='active'>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Country</th>
            </tr>
        </thead>
        <tbody>
            <tr class='success'>
                <td>1</td>
                <td>John Doe</td>
                <td>28</td>
                <td>USA</td>
            </tr>
            <tr class='danger'>
                <td>2</td>
                <td>Jane Smith</td>
                <td>34</td>
                <td>UK</td>
            </tr>
            <tr>
                <td class='warning'>3</td>
                <td>Mike Johnson</td>
                <td>25</td>
                <td>Canada</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Emily Davis</td>
                <td>30</td>
                <td>Australia</td>
            </tr>
        </tbody>
    </table>
	</div>
	
</body>
</html>
