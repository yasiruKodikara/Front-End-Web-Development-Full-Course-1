<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Load method callback parameter</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <!--The optional callback parameter specifies a callback function to run when the load() method is completed. The callback function can have different parameters:

        responseTxt - contains the resulting content if the call succeeds
        statusTxt - contains the status of the call
        xhr - contains the XMLHttpRequest object-->

        <button class="btn1">Get External content </button>

        <div class="mainCont">
            <h2>Let jQuery AJAX Change This Text</h2>
        </div>
    
        <div class="cont1"></div>
        <div class="cont2"></div>

    <script>
        $(document).ready(function(){
            $('.btn1').click(function(){
                $('.cont1').load('separatedForajax3.html',function(responseTxt,statusTxt,xhr){
                if(statusTxt == 'success'){
                alert('External content loaded successfully!');}
                
                if(statusTxt == 'error'){ //To check the error msg change the url
                alert('Error:' + xhr.status + xhr.statusText);}
            });
        });
            });
            
    </script>
</body>
</html>
