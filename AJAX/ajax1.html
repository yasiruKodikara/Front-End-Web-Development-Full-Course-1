<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Load method</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <button class="btn1">Get External content 1</button>

    <div class="mainCont">
        <h2>Let jQuery AJAX Change This Text</h2>
    </div>

    <div class="cont1"></div>
    <div class="cont2"></div>

    <script>
        $(document).ready(function(){
            $('.btn1').click(function(){
                $('.cont1').load('txt1forajax1.txt');
                $('.cont2').load('separatedForajax1.html');
            });
        });
    </script>
</body>
</html>
