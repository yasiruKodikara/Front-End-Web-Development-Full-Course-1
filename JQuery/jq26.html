<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Effects</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        .box{
            background:#bfff00;
            height:100px;
            width:100px;
            position:absolute;
            border:1px solid black;
        }
    </style>
</head>
<body>
    <button class='btn1'>START ANIMATION</button>
    <div class="box"></div>
    <script>
       $('.btn1').click(function(){
        $('.box').animate({left:'200px'},1000,function(){$(this).css('background-color','red')})
       }) 
    </script>
</body>
</html>
