<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form with Confirm Password</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.3/dist/jquery.validate.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-container label {
            display: block;
            margin-bottom: 5px;
        }
        .form-container input[type="text"],
        .form-container input[type="email"],
        .form-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .form-container button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .form-container button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Registration Form</h2>
        <form name="registrationForm_1">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

            <label for="confirmpassword">Confirm Password:</label>
            <input type="password" id="confirmpassword" name="confirmpassword">

            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        $(document).ready(function(){
            $('form[name="registrationForm_1"]').validate({
            //specify validation rules
            rules:{
                name:{
                    required:true
                },
                email:{
                    required:true,
                    email:true //for checking the format of an email
                },

                password:{
                    required:true,
                    minlength:5
                },
                confirmpassword:{
                    required:true,
                    minlength:5,
                    equalTo:'#password' //for checking both passwords are same or not
                }
            },

            //Specify validation error messages
            messages:{
                name:{
                    required:'Please enter your name!'
                },
                email:{
                    required:'please enter your email address!',
                    email:'Please enter valid email address!'
                },
                password:{
                    required:'please provide a password',
                    minlength:'Your password must be consist of at least 5 characters'
                },
                confirmpassword:{
                    required:'Please Re-enter the password',
                    minlength:'Your password must be consist of at least 5 characters',
                    equalTo:'Please enter the same as above'
                }
            }
        });


        });
        
    </script>
</body>
</html>
