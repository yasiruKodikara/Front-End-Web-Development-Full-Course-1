<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading Effects</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <button class='btn1'>FadeIn</button>
    <button class='btn2'>FadeOut</button>
    <button class='btn3'>FadeToggle</button>
    <button class='btn4'>FadeTo</button>

    
    <div id="div1" style="width:80px;height:80px;display:none;background-color:red;"></div><br>
    <div id="div2" style="width:80px;height:80px;display:none;background-color:green;"></div><br>
    <div id="div3" style="width:80px;height:80px;display:none;background-color:blue;"></div>
    
    

    <script>
        //fadeIn
        $('.btn1').click(function(){
            $('#div1').fadeIn(1000);
            $('#div2').fadeIn(2000);
            $('#div3').fadeIn(3000);
        });

        //fadeOut
        $('.btn2').click(function(){
            $('#div1').fadeOut(1000);
            $('#div2').fadeOut(2000);
            $('#div3').fadeOut(3000);
        });

        //fadeToggle
        $('.btn3').click(function(){
            $('#div1').fadeToggle(1000);
            $('#div2').fadeToggle(2000);
            $('#div3').fadeToggle(3000);
        });

        //fadeTo
        $('.btn4').click(function(){
            $('#div1').fadeTo(1000,0.15);
            $('#div2').fadeTo(2000,0.4);
            $('#div3').fadeTo(3000,0.7);
        });

    </script>
</body>
</html>
