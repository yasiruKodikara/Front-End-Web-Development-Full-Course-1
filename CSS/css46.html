<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css math functions</title>
    <style>
        /*calc */
        /*calc(expression) */
        .div1{
            background-color:yellow;
            position:absolute;
            width:calc(100%-100px);
        }
        /*max*/
        /*max(expression) */
        .div2{
            background-color:rgb(255, 60, 0);
            position:absolute;
            width:max(50%,400px);
        }
        /*min*/
        /*min(expression) */
        .div3{
            background-color:rgb(60, 255, 0);
            position:absolute;
            width:min(50%,400px);
        }

    </style>
</head>
<body>
    <div class="div1">
        this is my div
    </div><br>
    <div class="div2">
        this is my div
    </div><br>
    <div class="div3">
        this is my div
    </div>
</body>
</html>
