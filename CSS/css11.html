<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
</head>
<body>
    <!--
    default display - block -div
    inline - span ,ancor,img
    -->
    <!--block level elemtns-->
    <h1 style='background-color: red;'>heading1</h1>
    <h2 style="display:none;">heading2</h2>
    <h2 style="visibility: hidden;">heading3</h2>

    <!--inline elemtns-->
    <a href="#" style="display:block;background-color:green;">mylink1</a>
    <a href="#">mylink2</a>
    <a href="#">mylink3</a>
</body>
</html>
