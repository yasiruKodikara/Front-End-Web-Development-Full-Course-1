<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color keywords</title>
    <style>
        body{
            background-image:url(3481577.jpg);
            background-repeat:no-repeat;
        }
        .div1{
            
            background-color:transparent;
        }
        .div2{
            background-color:hsla(0, 100%, 50%,0.7);

        }
        .div0{
            color:rgba(0, 0, 255, 0.5);
            border:20px solid currentcolor;;
        }
        .inherit{
            
            border:20px solid red;
        }
        .inh{
            border:inherit;
        }
    </style>
</head>
<body>
    <h1>heading</h1>
    <p>para</p>
    <div class="div0">
        <h1>this is a heading</h1>
        <p>this is a para</p></div>
    <div class="div1">
        <h1>this is a heading</h1>
        <p>this is a para</p>
    </div>
    <div class="div2">
        <h1>this is a heading</h1>
        <p>this is a para</p>
    </div>
    <div class="inherit">
        <h1 class="inh">this is a heading</h1>
        <p>this is a para</p>
    </div>
</body>
</html>
