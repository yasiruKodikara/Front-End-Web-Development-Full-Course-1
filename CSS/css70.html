<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object-fit</title>
    <style>
        .container1 .img1{
            width: 300px;
            height: 100px;
            object-fit: cover;
            
        }

        .container2 .img2{
            width: 300px;
            height: 100px;
            object-fit: contain;
            
        }

        .container3 .img3{
            width: 300px;
            height: 100px;
            object-fit: fill;
            
        }
        .container4 .img4{
            width: 300px;
            height: 100px;
            object-fit: none;
            
        }

        .container5 .img5{
            width: 300px;
            height: 100px;
            object-fit: scale-down;
            
        }
    </style>
</head>

<body>
    <div class="container1">
        <img class='img1' src="3481577.jpg" alt="image">
    </div>
    <br>
    <div class="container2">
        <img class='img2' src="3481577.jpg" alt="image">
    </div>
    <br>
    <div class="container3">
        <img class='img3' src="3481577.jpg" alt="image">
    </div>
    <br>
    <div class="container4">
        <img class='img4' src="3481577.jpg" alt="image">
    </div>
    <br>
    <div class="container5">
        <img class='img5' src="3481577.jpg" alt="image">
    </div>
</body>
</html>
