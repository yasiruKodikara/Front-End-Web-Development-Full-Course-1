<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .tooltip1 {
            width: 100px;
            background-color: aqua;
            font-size: 12px;
            border-radius: 6px;
            padding: 5px;
            visibility: hidden;
            
            
        }
        .tooltip::after{
            content:'';
            position:absolute;
            top:100%;
            left:50%;
            border-width:5px;
            border-style:solid;
            border-color:aqua transparent transparent transparent;
        }
        .div1:hover .tooltip1 {
            visibility: visible;
        }
    </style>
</head>
<body>
    <div class='div1'>
        <p>this is a paragraph</p>
        <span class="tooltip1">this is the tooltip</span>
    </div>
</body>
</html>
