<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web fonts</title>
    <style>
        @font-face{
            font-family:myfont;
            src:url('Super Story Personal Use.ttf');
        }
        h1{
            font-family: myfont;
            font-weight: bold;
            background-image:linear-gradient(45deg,blue,black);
            color: #00FFFF; /* Luminous color */
            padding:10px;
            border-radius:5px;
            letter-spacing: 2px;
            text-shadow:3px 3px 3px black;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>WATER WORLD!</h1>
</body>
</html>
