<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute selectors</title>
    <link rel="stylesheet" href="styles.css">
    <style>
            a[target]{
                color:red;
            }
            a[target="_blank"]{
                color:rgb(255, 238, 0);
            }	
    </style>
</head>
<body>
    <a href="#">mylink1</a>
    <a href="#" target="_blank">mylink1</a>
    <a href="#" target="_blank">mylink1</a>
    <a href="#" target="_top">mylink1</a>
    <a href="#" target="_self">mylink1</a>
    <a href="#" target="_blank">mylink1</a>
</body>
</html>
