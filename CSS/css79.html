<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive web designing _3(media queries_1)</title>
    <style>
       /*
       responsive rules

       1.dont give fixed widths to each elements.(just give relative widths).
       2.use media queries to change the layout of the page.
       3.use viewport meta tag.
         4.use relative units like %,em,rem.
       */

        /*
        syntax of a media query (example)

        @media only screen and (max-width:600px){
            body{
                background-color:red;
            }
        }
        */
       


        body{
            background-color:red;
            font-size:30px;
        }

        @media only screen and (max-width:600px){
            body{
            background-color:green;
            font-size:18px;
        }
        }
    </style>
</head>
<body>
    <h1>Media queries</h1>
</body>
</html>
