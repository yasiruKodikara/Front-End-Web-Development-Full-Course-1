<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop down</title>
    <style>
        .btn{
            background-color: blueviolet;
            color:white;
            padding:20px;
            font-size: 18px;
            border:none;
        }
        .dropdown-content{
            position:absolute;
            background-color: aqua;
            min-width:200px;
            display:none;
        }
        .dropdown:hover .dropdown-content{
            position:relative;
            background-color: aqua;
            min-width:200px;
            display:block;
        }
        .dropdown-content a{
            display:block;
            padding:10px;
            text-decoration: none;
            color:black;
        }
        .dropdown{
            position:relative;
            display:inline-block;
        }
    </style>
</head>
<body>
    <div class="dropdown">
        <button class="btn">DropDown</button>
    <div class="dropdown-content">	
        <a href="#">Home</a>
        <a href="#">Home</a>
        <a href="#">Home</a>
        <a href="#">Home</a>
        <a href="#">Home</a>
    </div>
    </div>
    
</body>
</html>
