<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>align</title>
    <style>
        /*align div to center*/
        .div1{
            width:60%;
            border:2px solid red;
            margin:auto;
            padding:10px 10px 10px 10px;
        }
        /*align text to center*/
        p{
            text-align:center;
        }
        /*align image to center*/
        img{
            display:block;
            margin:auto;
            width:90px;
            height: 90px;
        }
    </style>
</head>
<body>
    <div class='div1'><p>my div</p></div>
    <img src="3481577.jpg">
</body>
</html>
