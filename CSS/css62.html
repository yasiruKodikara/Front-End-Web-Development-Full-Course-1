<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            width:100px;
            background-color:red;
            height:50px;
            transition:width 2s,height 3s;
        }
        .div1:hover{
            width:200px;
            height:200px;
        }

        .div2{
            width:100px;
            background-color:red;
            height:50px;
            transition:width 2s,height 3s;
            transition-timing-function:linear;
        }
        .div2:hover{
            width:200px;
            height:200px;
        }
        .div3{
            width:100px;
            background-color:red;
            height:50px;
            transition:width 2s,height 3s;
            transition-timing-function:ease-in;
        }
        .div3:hover{
            width:200px;
            height:200px;
        }
        .div4{
            width:100px;
            background-color:red;
            height:50px;
            transition:width 2s,height 3s;
            transition-timing-function:ease-out;
        }
        .div4:hover{
            width:200px;
            height:200px;
        }
        .div5{
            width:100px;
            background-color:red;
            height:50px;
            transition:width 2s,height 3s;
            transition-timing-function:ease;
        }
        .div5:hover{
            width:200px;
            height:200px;
        }
        .div6{
            width:100px;
            background-color:red;
            height:50px;
            transition:width 2s,height 3s;
            transition-timing-function:ease;
            transition-delay:1s;
        }
        .div6:hover{
            width:200px;
            height:200px;
        }
        .div7{
            width:100px;
            background-color:red;
            height:50px;
            transition:width 2s,height 3s;
            transition-timing-function:ease;
            transition-delay:1s;
        }
        .div7:hover{
            width:200px;
            height:200px;
            transform:rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="div1">
        <p>this is a paragraph</p>
    </div><br>
    <div class="div2">
        <p>this is a paragraph</p>
    </div>
    <div class="div3">
        <p>this is a paragraph</p>
    </div><br>
    <div class="div4">
        <p>this is a paragraph</p>
    </div><br>
    <div class="div5">
        <p>this is a paragraph</p>
    </div><br>
    <div class="div6">
        <p>this is a paragraph</p>
    </div><br>
    <div class="div7">
        <p>this is a paragraph</p>
    </div><br>
</body>

</html>
