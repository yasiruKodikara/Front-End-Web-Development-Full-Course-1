<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive web designing _5(min-device-width)</title>
    <style>
        /*background image resizing */
       .div1{
        width:100%;
        height:800px;
        background-image:url('3481577.jpg');
        background-repeat:no-repeat;
        background-size:100%; /*contain,cover,100%*/
       }
       
       @media only screen and (min-device-width:700px){
        .div1{
            background-image:url('2867481.jpg');
            background-repeat:no-repeat;
            background-size:100%; 
        }
        
       }

    </style>
</head>
<body>
    <div class='div1'></div>
    
    
</body>
</html>
