<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image styligns</title>
    <style>
        img{
            
            border-radius: 20%;
            border: 5px solid rgb(61, 139, 139);
            /*responsive*/
            width: 50%;
            height: auto;
            margin-right:auto;
            margin-left:auto;
            display: block;
            opacity:0.4;
            z-index: 0;

        }
        .div1{
            position:relative;
            bottom:600px;
            right:200px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="div2">
        <img src="3481577.jpg">
        <div class="div1">
            my text
        </div>
    </div>
    
    
</body>
</html>
