<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css variables</title>
    <style>
        /*css variable syntax*/
        /*var(--name,value)  */

        /*css global variable*/
        /* :root{} */

        /*css local variable*/
        /* .class{} */
        
        
        :root{
            --maincolor:rgb(0, 212, 28);
        }


        h1{
            color:var(--maincolor,blue);
        }
        h2{
            color:var(--maincolor,blue);
        }
        .div1{
            background-color:var(--maincolor,blue);
            width:300px;
            height:300px;
        }
        p{
            color:var(--maincolor,blue);
        }
        


        


    </style>
</head>
<body>
    <h1>this is a heading</h1>
    <h2>this is a heading</h2>
    <p>this is a para</p>

    <div class="div1"></div>
    </div>
    
</body>
</html>
