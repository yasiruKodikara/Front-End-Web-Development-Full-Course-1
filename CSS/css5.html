<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icons</title>
    <script src="https://kit.fontawesome.com/94b09f8a0a.js" crossorigin="anonymous"></script>

    <style>
        .fa-solid, .fa-solid {
            color:rgb(255, 10, 10);
            font-size:30px;
            
        }
       

        .fa-brands{
            color:rgb(95, 95, 255);
            font-size:30px;
        }
        
        .fa-brands:hover{
            color:rgb(95, 95, 255);
            font-size:30px;
            filter:blur(2px);
            font-size: 40px;
        }
    </style>

</head>
<body>
    <i class="fa-solid fa-download"></i>
    <i class="fa-brands fa-facebook"></i>
    <i class="fa-solid fa-circle-user"></i>
</body>
</html>
