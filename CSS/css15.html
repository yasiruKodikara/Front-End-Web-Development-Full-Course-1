<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Index</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .div1{
            width: 100px;
            height: 100px;
            background-color: rgba(236, 60, 60, 0.315);
            position: absolute;
            z-index: 2;
            backdrop-filter:blur(5px);
        }
        .div2{
            width: 100px;
            height: 100px;
            background-color: rgb(0, 0, 0);
            position: absolute;
            z-index: 1;
            top: 50px;
            left: 50px;
        }
        .div3{
            width: 100px;
            height: 100px;
            background-color: rgba(255, 21, 21, 0.438);
            position: absolute;
            z-index: 3;
            top: 100px;
            left: 100px;
            backdrop-filter:blur(5px);
        }
    </style>
</head>
<body>
    <div class='div1'></div>
    <div class='div2'></div>
    <div class='div3'></div>
    <div class='div4'></div>
    <div class='div5'></div>
</body>
</html>
