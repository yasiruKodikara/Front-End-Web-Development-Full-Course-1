<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo elements2</title>
    <style>
        .div1 .p1::before{
            content:'HIII';
        }
        .div1 .p2::after{
            content:'HIII';
        }
        p::selection{
            color:yellow;
            background-color:blue;
        }
    </style>
</head>
<body>
    <div class="div1">
        <p class="p1">this is a paragraph</p>
        <p class="p2">this is a paragraph</p>
    </div>
</body>
</html>
