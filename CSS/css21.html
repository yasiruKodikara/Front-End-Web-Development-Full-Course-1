<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float_2</title>
    <style>
        .div1{
            padding:6px;
            background-color:yellow;
            float:left;
            
        }
       .div2{
            padding:6px;
            background-color:rgb(0, 26, 255);
            clear:left;
       }
    </style>
</head>
<body>
    <div class="div1">
        div1
    </div>
    <div class="div2">
        div2
    </div>
    <div class="div3">
        div3
    </div>
</body>
</html>
