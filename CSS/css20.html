<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float_2</title>
    <style>
        .div1{
            background-color: rgb(255, 0, 0);
            width: 90px;
            height: 90px;
            float: left;
        }
        .div2{
            background-color: rgb(0, 255, 21);
            width: 90px;
            height: 90px;
            float: left;
        }
        .div3{
            background-color: rgb(0, 47, 255);
            width: 90px;
            height: 90px;
            float: left;
        }
    </style>
</head>
<body>
    <div class="div1">
        div1
    </div>
    <div class="div2">
        div2
    </div>
    <div class="div3">
        div3
    </div>
</body>
</html>
