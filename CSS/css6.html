<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        a:link{
            color:rgb(0, 0, 0);
            background-color: rgb(255, 0, 0);
            text-decoration: none;
            padding:10px 20px;
            border-radius: 5px;
        }
        a:visited{                        /*link - visited - hover - active   should be correct order*/
            color:blue;
        }
        a:hover{
            color:green;
        }
        a:active{
            color:rgb(123, 255, 0);
        }

    </style>
</head>
<body>
    <a href="#" class='link1'>Click here</a>
</body>
</html>
