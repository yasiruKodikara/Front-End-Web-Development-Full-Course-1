<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>outline</title>
    <style>
        .div1{
            outline-style:solid;
            outline-width:5px;
            outline-color:red;
        }

        /*short hand method*/
       .div2{
            outline:20px dotted green;

        }

        .div3{
            outline-style:dashed;
            outline-offset: 30px;
        }

        .div4{
            outline-style:groove;
        }

        .div5{
            outline-style:double;
        }

        .div6{
            outline-style:ridge;
        }
        .div7{
            outline-style:inset;
        }
        .div8{
            outline-style:outset;
        }
    </style>
</head>
<body>
    <div class='div1'>
        <h1>My Heading</h1>
    </div>
    <div class='div2'>
        <h1>My Heading</h1><br><br><br>
    </div>
    <div class='div3'>
        <h1>My Heading</h1>
    </div>
    <div class='div4'>
        <h1>My Heading</h1>
    </div>
    <div class='div5'>
        <h1>My Heading</h1>
    </div>
    <div class='div6'>
        <h1>My Heading</h1>
    </div>
    <div class='div7'>
        <h1>My Heading</h1>
    </div>
    <div class='div8'>
        <h1>My Heading</h1>
    </div>
</body>
</html>
