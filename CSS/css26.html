<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo class</title>
    <style>
        a:link{  /*selector:pseudo-class*/
            color:brown;
        }
        a:visited{
            color:red;
        }                   /*link,visited,hover,active should be order*/
        a:hover{
            color:chartreuse;
        }
        a:active{
            color:blue;
        }
    </style>
</head>
<body>
    <div class="div1">
        <p><a href='#'>click here</a></p>
    </div>
</body>
</html>
