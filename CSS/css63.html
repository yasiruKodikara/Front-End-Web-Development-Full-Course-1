<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations1</title>
    <style>
        .div1{
            width:200px;
            height: 200px;
            background-color: red;
            animation-name:aneme1;
            animation-duration:5s;

        }
        @keyframes aneme1{
            from{
                background-color: red;
            }
            to{
                background-color: blue;
            }
        }
    </style>
</head>
<body>
    <div class='div1'></div>
    </div>
</body>
</html>
