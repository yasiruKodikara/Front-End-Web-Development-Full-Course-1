<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline block</title>
    <style>
        /*inline cannot apply top and bottom margins*/
        /*only can add left right margins*/
        /*inline-block can add top right bottom left margins*/
        .Inline{
            display:inline;
            padding:6px;
            background-color:rgb(30, 255, 0);
        }
        .inline-block{
            display:inline-block;
            padding:6px;
            background-color:rgb(0, 26, 255);
        }
        .block{
            display:block;
            padding:6px;
            background-color:rgb(255, 0, 0);
        }
    </style>
</head>
<body>
    <h2>Inline</h2>
    <div class='Inline'>Inline element1</div>
    <div class='Inline'>Inline element2</div>

    <h2>Inline-Block</h2>
    <div class='inline-block'>inline block element1</div>
    <div class='inline-block'>inline block element2</div>
    <div class='inline-block'>inline block element3</div>

    <h2>Block</h2>
    <div class='block'> block element1</div>
    <div class='block'> block element2</div>
    <div class='block'> block element3</div>
</body>
</html>
