<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D transforms</title>
    <style>
        .div1{
            width:100px;
            height:100px;
            background-color:blue;
        }
        .div1:hover{
            transform:translate(50px,100px);
        }
        .div2{
            width:100px;
            height:100px;
            background-color:blue;
        }
        .div2:hover{
            transform:rotate(120deg);
        }
        .div3{
            width:100px;
            height:100px;
            background-color:blue;
            margin:200px;
        }
        .div3:hover{
            transform:scale(2,3);
        }
        .div4{
            width:100px;
            height:100px;
            background-color:blue;
            margin:200px;
        }
        .div4:hover{
            transform:scaleX(0.3);
        }
        .div5{
            width:100px;
            height:100px;
            background-color:blue;
            margin:200px;
        }
        .div5:hover{
            transform:scaleY(0.3);
        }
        .div6{
            width:100px;
            height:100px;
            background-color:blue;
            margin:200px;
        }
        .div6:hover{
            transform:skewX(30deg);
        }
        .div7{
            width:100px;
            height:100px;
            background-color:blue;
            margin:200px;
        }
        .div7:hover{
            transform:skewY(30deg);
        }
        .div8{
            width:100px;
            height:100px;
            background-color:blue;
            margin:200px;
        }
        .div8:hover{
            transform:skew(30deg,40deg);
        }
        .div9{
            width:100px;
            height:100px;
            background-color:blue;
            margin:200px;
        }
        .div9:hover{
            transform:skew(30deg,40deg);
        }
        .div10{
            width:100px;
            height:100px;
            background-color:blue;
            margin:200px;
        }
        .div10:hover{
            transform:matrix(1,-0.3,0,1,0,0) /*scaleX,skewY,skewX,scaleY,translateX,translateY*/
        }
    </style>
</head>
<body>
    <div class='div1'></div><br>
    <div class='div2'></div><br>

    <div class='div3'></div><br>
    <div class='div4'></div><br>
    <div class='div5'></div><br>
    <div class='div6'></div><br>
    <div class='div7'></div><br>
    <div class='div8'></div><br>
    <div class='div9'></div><br>
    
</html>
