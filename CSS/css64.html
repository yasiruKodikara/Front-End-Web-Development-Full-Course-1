<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations2</title>
    <style>
        .div1{
            width:200px;
            height: 200px;
            background-color: red;
            animation-name:aneme1;
            animation-duration:4s;
            animation-delay:2s;
            animation-iteration-count: infinite;

        }
        @keyframes aneme1{
            0%{
                background-color: red;
            }
            50%{
                background-color: rgb(0, 255, 13);
            }
            100%{
                background-color: rgb(0, 110, 255);
            }
        }
    </style>
</head>
<body>
    <div class='div1'></div>
    </div>
</body>
</html>
