<h1>{{title}}</h1>

<div class='container d-flex flex-column vh-100 align-items-center justify-content-center'>
<form (submit)="onSubmit(f)" class='w-50 mt-5' #f="ngForm">
  <fieldset>
    <h1>User Details</h1>
  <div>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" class='form-control mb-4' ngModel>
  </div>
  <div>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" class='form-control mb-4' ngModel>
  </div>
  <div>
    <label for="address">Address:</label>
    <input type="text" id="address" name="address" class='form-control mb-4' ngModel>
  </div>
  <input type="submit" value='submit' class='form-control btn btn-primary w-100'>


</fieldset>
</form>

</div><br><br>
<hr>
<app-tdf2></app-tdf2>
