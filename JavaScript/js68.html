<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Inspired Popup</title>
    <style>
        body {
            background-image: url('3481577.jpg'); /* Keep your original background */
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Keep the background fixed */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; /* Remove default body margin */
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensure body covers full viewport height */
        }

        .popup1 {
            width: 100%;
            height: 100%;
            position: fixed;
            background-color: rgba(0, 0, 0, 0.5); /* Darker overlay for nature feel */
            top: 0;
            left: 0;
            backdrop-filter: blur(10px); /* Slightly stronger blur */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000; /* Ensure it's on top */
        }

        .popup1 div {
            background-color: rgba(255, 255, 255, 0.9); /* Slightly transparent white */
            border: 1px solid rgba(0, 0, 0, 0.2); /* Lighter border */
            padding: 30px; /* Reduced padding */
            border-radius: 15px; /* More rounded corners */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); /* Soft shadow */
            max-width: 400px; /* Limit popup width */
            width: 90%; /* Responsive width */
        }

        .popup1 h2 {
            color: #333; /* Darker text */
            margin-bottom: 20px;
            font-size: 1.5em; /* Slightly larger heading */
        }

        .popup1 input[type="text"] {
            width: calc(100% - 22px); /* Adjust for padding and border */
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }

        .popup1 button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 10px; /* Space between buttons */
            transition: background-color 0.3s ease;
        }

        #btn2 {
            background-color: #4CAF50; /* Green submit button */
            color: white;
        }

        #btn3 {
            background-color: #f44336; /* Red cancel button */
            color: white;
        }

        #btn2:hover, #btn3:hover {
            opacity: 0.8; /* Slight hover effect */
        }

        .hidden {
            display: none;
        }

        #mybtn1 {
            position: fixed;
            top: 20px; /* Adjusted position */
            left: 20px;
            padding: 12px 25px;
            background-color: #388E3C; /* Darker green for button */
            color: white;
            border: none;
            border-radius: 20px; /* More rounded button */
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Button shadow */
        }

        #mybtn1:hover {
            background-color: #2E7D32; /* Darker green on hover */
        }

        #p1 {
            color: #333;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <button id='mybtn1'>Display Popup</button>
    <h1 id='p1'>Name</h1>

    <div class="popup1 hidden" id='namepopup1'>
        <div>
            <h2>🌲What is your name?</h2>
            <input type="text" id="name" placeholder='Your Name'><br><hr>
            <button onclick='submit()' id="btn2">Submit</button>
            <button onclick='cancel()' id="btn3">Cancel</button>
        </div>
    </div>

    <script>
        const mybtn1 = document.querySelector('#mybtn1');
        const namePopup = document.getElementById('namepopup1');
        const name1 = document.getElementById('name');

        mybtn1.onclick = () => {
            namePopup.classList.remove('hidden');
        }

        function cancel() {
            namePopup.classList.add('hidden');
            name1.value = '';
        }

        function submit() {
            document.getElementById('p1').innerHTML = name1.value;
            namePopup.classList.add('hidden');
            name1.value = '';
        }
    </script>
</body>
</html>
