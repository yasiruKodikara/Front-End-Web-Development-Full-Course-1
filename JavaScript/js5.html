<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //global scope
        let globalScope = 'This is local scope var';

        function test(){
            console.log(globalScope);
        }
        test()

        //local scope
        function test(){
            let localScope = 'this is local scope var';
            console.log(globalScope);
        }
        test()
        console.log(localScope); //this will gives an error
    </script>
     
</body>
</html>
