<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Listners</title>
</head>
<body>
    <button id = 'mybtn'>clickME</button>
    <script>
        function runMe(){
            console.log('running')
        }

        const mybtn = document.getElementById('mybtn');
        mybtn.addEventListener('click',runMe);

        mybtn.addEventListener('mouseleave',function(){
            alert('Dont leave Me!');
            console.log('Mouse Leave Detected!')
        });

        

    </script>
</body>
</html>
