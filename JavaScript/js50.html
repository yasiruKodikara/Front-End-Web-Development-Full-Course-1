<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oop5(object assign)</title>
</head>
<body>
    <script>

        const ob1 = {
            name:'ob1name',
            num:100
        }

        const ob2 = {
            showName(){
                console.log(this.name)
            }
        }

        Object.assign(ob1,ob2);

        ob2.showName()

    </script>

</body>
</html>
