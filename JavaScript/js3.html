<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //javascript data types
        let my_string = 'yasiru';
        let my_number = 24;
        let my_boolean = true;
        my_boolean = false;
        let my_null = null;
        let my_object = {
            name:'Akon',
            age:23
        }

        let my_array = [1,2,3,4,5,6];
        let my_function = function(){
            console.log('test');
        }

        console.log(my_object)

        //check data type
        console.log(typeof my_object);


        //Operations in javascript
        let a = 10;
        let b = 30;
        let c = a+b; 

        console.log(c)
        console.log(a-b);
        console.log(a/b);
        console.log(a%b);
        console.log(a*b);

        //increament
        console.log(a);
        ++a //= a=a+1
        console.log(++a);


        console.log(b);
        --b //=  b=b-1
        console.log(--b);

        //concatenation
        let fn = 'yasiru';
        let ln = 'kodikara';
        let fullName = fn+' '+ln;
        console.log(fullName)

        //short forms
        a = 90;
        b = 89;

        a+=45;
        console.log(a)


        //comparision operations
        a = 10;
        b = 90;

        console.log(a==b) //false
        console.log(a!=b) //true
        console.log(a>b) //false
        console.log(a<b) //true

        //AND &&
        a = true;
        b = false;
        console.log(a && b)

        //OR ||
        console.log(a||b);

        //NOT !
        console.log(!a)





    </script>
</body>
</html>
