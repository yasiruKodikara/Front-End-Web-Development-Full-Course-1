<body>
    <script>
        //while loop
        let x = 1;
        while(x <= 10){
            console.log(x);

            if (x ==5){
                break;
            }
            x+=1;
        }
        console.log('_-----______----------------')
        //do while
        let i = 0;
        do{
            i+=1;
            console.log(i);
        }while(i<10);
    </script>
</body>
