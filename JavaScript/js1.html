<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add JS to html</title>
</head>
<body>
    <h1>Add js to html</h1>
    <!--inline js-->
    <script>
        console.log('this is internal js');

        function Clear() {
            console.clear();
        }
    </script>

    <!--external js-->
    <script src="js files\js1.js"></script>
    <script src="js files\js2.js"></script>

    <!--onclick-->
    <button onclick="console.log('Button click relust..')">
        Click Me
    </button>

    <!--console clear-->
    <button onclick="Clear()">Clear</button>


</body>
</html>
