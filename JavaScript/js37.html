<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckBoxValidation</title>
</head>
<body>
    <script>
        function validation(){
            let valid = false;

            if (document.getElementById('js').checked){
                valid = true;
            }else if(document.getElementById('jq').checked){
                valid = true;
            }else if(document.getElementById('Ajs').checked){
                valid = true;
            }else if(document.getElementById('Njs').checked){
                valid = true;
            }
            
            if(valid){
                alert('Validation Successfull');
            }else{
                alert('Please select atleast one technology!');
                return false;
            }
        }
    </script>
    <h1>CheckBoxValidation</h1>
    <form action="" method="" onsubmit="return validation()">
        <input type="checkbox" name="c1" id="js" value="'js">JavaScript<br>
        <input type="checkbox" name="c2" id="jq" value="Jquery">JQuery<br>
        <input type="checkbox" name="c3" id="Ajs" value="Ajs">AngularJavaScript<br>
        <input type="checkbox" name="c4" id="Njs" value="Njs">NodeJavaScript<br>
        <input type="submit" name="s1"  value="SUBMIT">
    </form>
    

</body>
</html>
