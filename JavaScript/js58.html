<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js libraries(lodash library)</title>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
</head>
<body>
    
    <script>
        const array1 = [12,23,34,45,5,67,78,89];
        console.log(_.sum(array1));

        //random
        console.log(_.random(1,100));

        //random element
        console.log(_.sample(array1));
    </script>
</body>
</html>
