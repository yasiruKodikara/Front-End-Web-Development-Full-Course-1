<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnemeJS</title>
</head>
<body>
    <h1>AnimeJS</h1>
    <div style="width:50px; height: 50px; background-color: red;" class="box1">
        <div style="width:50px; height: 50px; background-color: red;" class="box2">
            <div style="width:50px; height: 50px; background-color: red;" class="box3"></div>
        </div>

    </div>
    <script type="module">
       import anime from 'https://unpkg.com/animejs@3.2.1/lib/anime.es.js';

        anime({
            targets:'.box1',
            translateX:250,
            
            
            duration: 800
        });
        anime({
            targets:'.box2',
            translateX:250,
            
            
            duration: 800
        });
        anime({
            targets:'.box3',
            translateX:250,
            
            
            duration: 800
        })
    </script>
</body>
</html>
