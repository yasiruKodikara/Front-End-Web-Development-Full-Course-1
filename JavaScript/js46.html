<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oop2</title>
</head>
<body>
    <script>
        //class

        class Person{
            constructor(name,age,hobbies){
                this.name = name;
                this.age = age;
                this.hobbies = hobbies;
            }

            showInfo(){
                console.log('hi iam '+this.name+' iam '+this.age+' years old')
            }

            static sayHi(){
                console.log('hi.this is a static method')   //static method
            }
        }

        let user1 = new Person('akon',20,['reading','writing']);
        console.log(user1);
        user1.showInfo();

        let user2 = new Person('bkon',20,['reading','writing']);
        console.log(user2);
        user2.showInfo();

        //inheritance

        class Student extends Person{
            showHobbies(){
                console.log('my hobbies are '+this.hobbies)
            }
            showInfo(){
                console.log('Student name is'+this.name+'and the age is '+this.age)
            }
        }

        let student1 = new Student('çkon',19,['it','math']);
        console.log(student1);
        student1.showInfo();
        student1.showHobbies();
        student1.showHobbies(); //this will not work because student1 is an object of Student class and showHobbies() is a method of Student class
        student1.showInfo(); //this will work because student1 is an object of Student class and showInfo() is a method of Person class

        //method overriding
        student1.showInfo();

        //static methods
        Person.sayHi(); //static methods can call without an object
        
    </script>
</body>
</html>
