
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build a Game with Math(project_2)</title>
    <style>
        body {
            background-image:url('3481577.jpg');
            background-repeat:no-repeat;
            background-position:50% 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: red;
            font-size: 3em;
            font-family: "comic sans ms";
        }

        .main-section {
            width: 500px;
            height: 300px;
            background-color: rgba(255, 0, 0, 0.123);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
            border-radius: 10px;
            font-size: 2.5em;
            font-weight: bold;
            font-family: monospace;
            position: relative;
            backdrop-filter:blur(8px);
            
        }

        .flex {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .main-section input {
            border: 0;
            background-color: transparent;
            border-bottom: 2px solid black;
            padding: 10px;
            padding-bottom: 0px;
            font-size: 1em;
            font-weight: bold;
            width: 80px;
            font-family: monospace;
        }

        #answer:focus {
            outline: none;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        .hidden {
            display: none;
        }

        #start {
            background-color: rgb(255, 0, 0);
            color: white;
            border: 0;
            padding: 10px;
            border-radius: 10px;
            font-size: 1.5em;
            font-family: monospace;
            cursor: pointer;
        }

        #score-section {
            font-size: 2em;
            font-family: monospace;
            font-weight: bold;
        }

        #submit-button {
            background-color: red;
            color: white;
            border: 0;
            padding: 10px;
            border-radius: 5px;
            font-size: 1em;
            font-family: monospace;
            cursor: pointer;
        }

        #q {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: rgb(255, 81, 0);
        }

        #timer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: rgb(255, 0, 0);
        }
    </style>
</head>

<body>
    <h1>Math Game</h1>
    <div class="main-section">
        <div class="flex hidden" id="question-section">
            <p id="question">Equation</p>
            =
            <input type="number" id="answer" />
            <button onclick='nextQuestion()' id="submit-button">Submit</button>
        </div>
        <button onclick='startGame()' id="start">Start</button>
        <div id="q">0</div>
        <div id="timer"><span id="time">0</span>s</div>
    </div>

    <p id="score-section">Score: <span id="score">0</span>/10</p>

    <script>
        const questionSection = document.querySelector("#question-section");
        const question = document.querySelector("#question");
        const answer = document.querySelector("#answer");
        const startButton = document.querySelector("#start");
        const score = document.querySelector("#score");
        const submitButton = document.querySelector("#submit-button");
        const q = document.querySelector("#q");
        const timeOutput = document.querySelector("#time");
        let correctAns = 0;
        let count = 0;
        let timer;
        let time;
        let duration = 10;

        function startGame(){
            startButton.classList.add('hidden');
            questionSection.classList.remove('hidden');
            score.innerHTML = 0;
            generateQuestion();
            count = 0;
            startTimer();
        }

        function randomNumber(min,max){
            return Math.floor(Math.random()*(max-min+1))+min
        }
        
        function generateQuestion(){
            answer.value = '';
            let quesType = randomNumber(1,4);
            switch(quesType){
                case 1://addition
                let num1 = randomNumber(10,100);
                let num2 = randomNumber(10,100);
                question.textContent = num1+' + '+num2;
                    break;
                case 2://subtraction
                let num3 = randomNumber(10,100);
                let num4 = randomNumber(10,100);
                question.textContent = num3+' - '+num4;
                    break;
                case 3://multiplication
                let num5 = randomNumber(10,100);
                let num6 = randomNumber(10,100);
                question.textContent = num5+' * '+num6; 
                    break;
                case 4://division
                let num7 = randomNumber(10,100);
                let num8 = randomNumber(10,100);
                question.textContent = num7+' / '+num8;
                    break;
                default:
                    break;
            }
            
            correctAns = num1+num2;
            count++
            q.innerHTML = count;

        }

        function nextQuestion(){
            
            if (answer.value==correctAns){
                score.innerHTML++
            }
            else if(answer.value == ''){
                score.innerHTML = score.innerHTML-1;
            }
            
            
            if(count==10){
                alert('Game Over.Your score is'+score.innerHTML+'/10');
                question.innerHTML = '';
                score.innerHTML = 0;
                startButton.classList.remove('hidden');
                questionSection.classList.add('hidden');
                count = 0;
            }
            generateQuestion();
        }

        function startTimer(){
            time = 0;
            clearInterval(timer);
            timer = setInterval(function(){
                time++;
                timeOutput.innerHTML = time;
                if(time >= duration){
                nextQuestion();
            }
            },1000)
            
        }


    </script>
</body>

</html>
