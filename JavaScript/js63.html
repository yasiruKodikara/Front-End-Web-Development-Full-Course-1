<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template literals</title>
</head>
<body>
    <p id="para1"></p>
    <script>
        let name = 'akon';
        let age = 20;
        //let output = 'My name is ' + name + ' and I am ' + age + ' years old.';
        let output = `My name is ${name} and  I am ${age} years old....`;

        output+= `In next year I will be ${age+1} years old.`;
        output+=`i say ${greeting()}`
        document.getElementById('para1').innerHTML = output;


        function greeting(){
            return `good morning`
        }
    </script>
</body>
</html>
