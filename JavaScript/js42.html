<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catching the threw error</title>
</head>
<body>
    <h1>Throwing error</h1>
    <script>
        try{
            let age = prompt('Enter your age');
        if(isNaN(age)){
            //alert('invalid age');
            throw new Error('Not an valid Number');
        }
        console.log('age is '+age);
        }catch(e){
            console.log(e);
        }
        
        console.log('last line')
    </script>
</body>
</html>
