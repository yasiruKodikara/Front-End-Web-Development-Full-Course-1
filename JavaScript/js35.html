<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id = 'btn' onclick = 'pressed()'>
        ClickME
    </button>

    <p id="output"></p>
    <script>
        const btn = document.getElementById('btn');
        const output = document.getElementById('output');

        function pressed(){
            output.innerHTML = 'Clicked';
            setTimeout(function(){
                output.innerHTML = 'Changed';
            },2000);
        }
    </script>
</body>
</html>
