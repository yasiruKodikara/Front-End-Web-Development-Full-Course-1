<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop through an array</title>
</head>
<body>
    <script>
        //for in loop
        let user = {
            name:'akon',
            age:20,
            address:'colombo'
        }

        for (const data in user){
            console.log(user[data]);
        }
    </script>
</body>
</html>
