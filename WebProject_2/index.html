<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicCalculator</title>
    <style>
        body {
            background-color: black;
            margin: auto;
        }
        .backcont1, .backcont2, .backcont3, .backcont4 {
            border-radius: 50%;
            z-index: 0;
            position: relative;
            margin: auto;
        }
        .backcont1 {
            background-image: linear-gradient(to bottom, aqua, lightgreen, yellow);
            width: 200px;
            height: 200px;
            padding: 30px;
            top: 50px;
            left: 50px;
            position:absolute;
        }
        .backcont2 {
            background-image: linear-gradient(to bottom, aqua, lightgreen, yellow);
            width: 50px;
            height: 50px;
            padding: 30px;
            top: 150px;
            left: 150px;
        }
        .backcont3 {
            background-image: linear-gradient(to bottom, rgb(251, 255, 0), rgb(255, 153, 0), rgb(255, 0, 0));
            width: 200px;
            height: 200px;
            padding: 30px;
            top: 250px;
            left: 250px;
        }
        .backcont4 {
            background-image: linear-gradient(to bottom, rgb(251, 255, 0), rgb(255, 153, 0), rgb(255, 0, 0));
            width: 40px;
            height: 40px;
            padding: 30px;
            top: 350px;
            left: 350px;
        }
        .container {
            z-index: 5;
            background-color: rgba(255, 255, 255, 0.062);
            padding: 10px;
            margin: auto;
            backdrop-filter: blur(10px);
            text-align: center;
            border-radius: 10px;
            width: 80%;
            height: 500px;
            position: relative;
            top: 100px;
        }

        /* Media Queries for Responsiveness */
        @media (max-width: 1200px) {
            .backcont3 {
                left: 200px;
            }
        }
        @media (max-width: 992px) {
            .backcont1, .backcont3 {
                width: 150px;
                height: 150px;
                padding: 20px;
            }
            .backcont2, .backcont4 {
                width: 40px;
                height: 40px;
                padding: 20px;
            }
            .backcont3 {
                left: 150px;
            }
        }
        @media (max-width: 768px) {
            .backcont1, .backcont3 {
                width: 100px;
                height: 100px;
                padding: 15px;
            }
            .backcont2, .backcont4 {
                width: 30px;
                height: 30px;
                padding: 15px;
            }
            .backcont3 {
                left: 100px;
            }
        }
        @media (max-width: 576px) {
            .backcont1, .backcont3 {
                width: 80px;
                height: 80px;
                padding: 10px;
            }
            .backcont2, .backcont4 {
                width: 20px;
                height: 20px;
                padding: 10px;
            }
            .backcont3 {
                left: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">testadfa<br>adfadfasdf
        <header>
        </header>
    </div>
    <div class="backcont1">1</div>
    <div class="backcont2">2</div>
    <div class="backcont3">3</div>
    <div class="backcont4">4</div>
</body>
</html>
